[project]
name = "aprendizaje-supervisado"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.14.4"
dependencies = [
    "jinja2>=3.1.6",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "tensorflow>=2.22.0rc0",
]

[project.scripts]
aprendizaje-supervisado = "aprendizaje_supervisado:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
